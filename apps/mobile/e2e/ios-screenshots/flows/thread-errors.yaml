appId: com.lumio.app
name: Thread error recovery
---
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      LUMIO_ACTIVE_EMAIL: ${LUMIO_SCREENSHOT_EMAIL}
- openLink: "lumio:///thread?botId=${LUMIO_SCREENSHOT_BOT_ID}&name=Researcher"
- extendedWaitUntil:
    visible: ".*weekly limit.*"
    timeout: 20000
- assertVisible: "Set your own key"
- assertVisible: "Change model"
- takeScreenshot: 01-limit-banner
- tapOn: "Details"
- extendedWaitUntil:
    visible: ".*reply stopped at its key's weekly limit.*"
    timeout: 10000
- takeScreenshot: 02-limit-details
