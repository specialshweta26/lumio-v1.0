appId: com.lumio.app
---
- runFlow: launch-app.yaml
- runFlow:
    when:
      visible: "Sign up for Lumio"
    commands:
      - tapOn: "Sign in"
- extendedWaitUntil:
    visible: "Sign in to Lumio"
    timeout: 15000
- tapOn: "Email"
- inputText: ${LUMIO_ACTIVE_EMAIL}
- tapOn:
    text: "Use password"
    optional: true
- tapOn: "Password"
- inputText: ${LUMIO_SCREENSHOT_PASSWORD}
- hideKeyboard
- tapOn: "Sign in"
- tapOn:
    text: "Not Now"
    optional: true
- tapOn:
    text: "Don’t allow"
    optional: true
- tapOn:
    text: "Don't allow"
    optional: true
- extendedWaitUntil:
    visible: "Account"
    timeout: 40000
