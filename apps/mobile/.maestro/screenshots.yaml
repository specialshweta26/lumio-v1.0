appId: com.lumio.app
name: Lumio mobile screenshots
tags:
  - screenshots
---
- launchApp:
    clearState: true
    permissions:
      notifications: deny

# A cold API 34 emulator can show a launcher ANR over the healthy app.
- extendedWaitUntil:
    visible: "Sign up for Lumio|Pixel Launcher isn't responding"
    timeout: 30000
- runFlow:
    when:
      visible: "Pixel Launcher isn't responding"
    commands:
      - tapOn: "Close app"
- extendedWaitUntil:
    visible: "Sign up for Lumio"
    timeout: 30000
- takeScreenshot: "02-sign-up"
- tapOn: "Sign in"
- runFlow:
    when:
      notVisible:
        id: "server-address"
    commands:
      - assertVisible: "Sign in to Lumio"
      - takeScreenshot: "01-sign-in"
      - tapOn: "Use a custom server"
- assertVisible: "Server"
- takeScreenshot: "03-server"
- runFlow: helpers/server.yaml

- tapOn: "Email"
- inputText: ${LUMIO_SCREENSHOT_EMAIL}
- tapOn:
    text: "Use password"
    optional: true
- tapOn: "Password"
- inputText: ${LUMIO_SCREENSHOT_PASSWORD}
- hideKeyboard
- tapOn: "Sign in"
- tapOn:
    text: "Don’t allow"
    optional: true

- extendedWaitUntil:
    visible: "Researcher"
    timeout: 30000
- takeScreenshot: "04-inbox"

- tapOn: "Activity"
- extendedWaitUntil:
    visible: "Recent"
    timeout: 10000
- takeScreenshot: "05-activity"

- tapOn:
    id: "home-search-button"
    optional: true
- runFlow:
    when:
      notVisible:
        id: "search-sheet-field"
    commands:
      - tapOn: "Search"
- tapOn:
    id: "search-sheet-field"
- inputText: "fixture"
- hideKeyboard
- extendedWaitUntil:
    visible: "Weekly fixture review"
    timeout: 10000
- takeScreenshot: "06-search-results"
- tapOn:
    id: "search-sheet-close"

- openLink: "lumio:///new-group"
- assertVisible: "Search bots"
- takeScreenshot: "08-new-group"

- openLink: "lumio:///new-space"
- assertVisible: "Customer support"
- takeScreenshot: "09-new-space"

- openLink: "lumio:///account"
- extendedWaitUntil:
    visible: "Change password"
    timeout: 10000
- takeScreenshot: "10-account"
- tapOn: "Change password"
- assertVisible: "Current password"
- takeScreenshot: "10b-change-password"
- back
- scrollUntilVisible:
    element: "Notification settings"
    direction: DOWN
- takeScreenshot: "10c-account-notifications"

- openLink: "lumio:///models"
- extendedWaitUntil:
    visible: "Model"
    timeout: 10000
- assertNotVisible: "Active model"
- takeScreenshot: "11-models"
- tapOn: "Thinking"
- assertVisible: "Medium"
- takeScreenshot: "11a-thinking-menu"
- back
- assertNotVisible: "Medium"
- scrollUntilVisible:
    element: "Advanced"
    direction: DOWN
- tapOn: "Advanced"
- scrollUntilVisible:
    element: "Maximum output tokens"
    direction: DOWN
- takeScreenshot: "11b-models-advanced"

- openLink: "lumio:///voice"
- extendedWaitUntil:
    visible: "Scripted"
    timeout: 10000
- takeScreenshot: "12-voice"

- openLink: "lumio:///integrations"
- extendedWaitUntil:
    visible: "Search apps"
    timeout: 10000
- takeScreenshot: "13-integrations"
- tapOn:
    id: "integrations-advanced"
- scrollUntilVisible:
    element: "Add MCP server"
    direction: DOWN
- assertVisible: "Add MCP server"
- takeScreenshot: "14-integrations-advanced"

- openLink: "lumio:///thread?botId=${LUMIO_SCREENSHOT_BOT_ID}&name=Researcher"
- extendedWaitUntil:
    visible: "The fixture workspace is ready."
    timeout: 10000
- assertNotVisible: "Reply"
- assertNotVisible: "React"
- assertNotVisible: "More"
- takeScreenshot: "15-thread"
- assertVisible: "Show Message from Writer"
- assertNotVisible: "Update from Writer: The fixture launch note is drafted."
- takeScreenshot: "15e-thread-peer-folded"
- tapOn: "Show Message from Writer"
- assertVisible: "Update from Writer: The fixture launch note is drafted."
- takeScreenshot: "15f-thread-peer-expanded"
- tapOn: "Hide Message from Writer"
- tapOn: "Message Researcher"
- inputText: "Keyboard visibility check"
- assertVisible: "Keyboard visibility check"
- assertVisible: "Send"
- takeScreenshot: "15d-thread-keyboard"
- pressKey: Enter
- inputText: "Second line"
- assertVisible: 'Keyboard visibility check\nSecond line'
- hideKeyboard
- assertVisible: 'Keyboard visibility check\nSecond line'
- tapOn: "Message Researcher"
- assertVisible: 'Keyboard visibility check\nSecond line'
- assertVisible: "Send"
- takeScreenshot: "15g-thread-keyboard-reopened"
- longPressOn: "Message Researcher"
- tapOn: "Select all"
- eraseText: 1
- assertNotVisible: 'Keyboard visibility check\nSecond line'
- hideKeyboard
# Holding a message opens the reaction row and grouped actions next to it.
- longPressOn: "The fixture workspace is ready."
- assertVisible: "Reply"
- assertVisible: "👍"
- assertVisible: "Speak message"
- takeScreenshot: "15b-message-actions"
- back
# Settle the keyboard inset before measuring the next message target.
- hideKeyboard
- waitForAnimationToEnd
# User messages omit Speak.
- longPressOn: "Summarize the fixture launch checklist."
- assertVisible: "Reply"
- assertVisible: "👍"
- assertVisible: "Copy"
- assertNotVisible: "Speak message"
- tapOn: "Reply"
- assertVisible: "Cancel reply"
- tapOn: "Cancel reply"
- tapOn: "Bot actions"
- assertVisible: "Clear conversation"
- takeScreenshot: "16-bot-actions"
- back

- openLink: "lumio:///bot-settings?botId=${LUMIO_SCREENSHOT_BOT_ID}"
- extendedWaitUntil:
    visible: "Researcher"
    timeout: 10000
- assertVisible: "Advanced"
- tapOn: "Advanced"
- assertVisible: "Model"
# Label includes the resolved space model, e.g. "Space default (OpenAI: …)".
- assertVisible: "Space default.*"
- takeScreenshot: "17-bot-settings"

- openLink: "lumio:///computer?botId=${LUMIO_SCREENSHOT_BOT_ID}&name=Researcher"
- extendedWaitUntil:
    visible: "Take control"
    timeout: 10000
- takeScreenshot: "18-computer"

- openLink: "lumio:///group-thread?groupId=${LUMIO_SCREENSHOT_GROUP_ID}&name=Launch%20team"
- extendedWaitUntil:
    visible: "The fixture launch plan is ready."
    timeout: 10000
- assertNotVisible: "Reply"
- assertNotVisible: "React"
- assertNotVisible: "More"
- takeScreenshot: "19-group-thread"
- tapOn: "Message Launch team"
- inputText: "Group keyboard visibility check"
- assertVisible: "Group keyboard visibility check"
- assertVisible: "Send"
- takeScreenshot: "19b-group-thread-keyboard"
- eraseText
- hideKeyboard
- longPressOn: "The fixture launch plan is ready."
- assertVisible: "Reply"
- assertVisible: "👍"
- assertVisible: "Speak message"
- back

- openLink: "lumio:///group-settings?groupId=${LUMIO_SCREENSHOT_GROUP_ID}"
- extendedWaitUntil:
    visible: "Delete group"
    timeout: 10000
- takeScreenshot: "20-group-settings"

- openLink: "lumio:///routine?botId=${LUMIO_SCREENSHOT_BOT_ID}&botName=Researcher&routineId=${LUMIO_SCREENSHOT_ROUTINE_ID}"
- extendedWaitUntil:
    visible: "Weekly fixture review"
    timeout: 10000
- takeScreenshot: "21-routine"

# Verify saved appearance changes on already-mounted screens and modal routes.
- openLink: "lumio:///account"
- extendedWaitUntil:
    visible: "Dark"
    timeout: 10000
- tapOn: "Dark"
- takeScreenshot: "22-account-dark"
- scrollUntilVisible:
    element: "Notification settings"
    direction: DOWN
- takeScreenshot: "22b-account-notifications-dark"

- openLink: "lumio:///new-group"
- assertVisible: "Search bots"
- takeScreenshot: "24-new-group-dark"

- openLink: "lumio:///new-space"
- assertVisible: "Customer support"
- takeScreenshot: "25-new-space-dark"

- openLink: "lumio:///thread?botId=${LUMIO_SCREENSHOT_BOT_ID}&name=Researcher"
- extendedWaitUntil:
    visible: "The fixture workspace is ready."
    timeout: 10000
- takeScreenshot: "26-thread-dark"

- openLink: "lumio:///group-thread?groupId=${LUMIO_SCREENSHOT_GROUP_ID}&name=Launch%20team"
- extendedWaitUntil:
    visible: "The fixture launch plan is ready."
    timeout: 10000
- takeScreenshot: "27-group-thread-dark"

- openLink: "lumio:///group-settings?groupId=${LUMIO_SCREENSHOT_GROUP_ID}"
- assertVisible: "Delete group"
- takeScreenshot: "28-group-settings-dark"

- openLink: "lumio:///account"
- tapOn: "Light"
- openLink: "lumio:///thread?botId=${LUMIO_SCREENSHOT_BOT_ID}&name=Researcher"
- assertVisible: "The fixture workspace is ready."
- takeScreenshot: "29-thread-light-restored"

# Capture the reaction after theme comparisons. Reactions are append-only, so adding
# 👍 earlier would leak into dark/light thread frames with no remove control.
- longPressOn: "The fixture workspace is ready."
- tapOn: "👍"
- extendedWaitUntil:
    visible: "👍"
    timeout: 10000
- assertNotVisible: "Reply"
- takeScreenshot: "15c-message-reaction"
