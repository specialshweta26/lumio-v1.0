appId: com.lumio.app
name: Lumio mobile smoke
---
- launchApp:
    clearState: true

- assertVisible: "Sign up for Lumio"
- assertVisible: "Name"
- tapOn: "Sign in"
- runFlow:
    when:
      true: ${typeof LUMIO_MOBILE_API_URL !== "undefined" && LUMIO_MOBILE_API_URL != null && LUMIO_MOBILE_API_URL.trim() !== ""}
    file: helpers/server.yaml
- assertVisible: "Sign in to Lumio"
- tapOn: "Email"
- inputText: ${LUMIO_E2E_EMAIL}
- tapOn:
    text: "Use password"
    optional: true
- tapOn: "Password"
- inputText: ${LUMIO_E2E_PASSWORD}
- hideKeyboard
- tapOn: "Sign in"

- extendedWaitUntil:
    visible: "Create"
    timeout: 30000
- tapOn: "Create"
- tapOn: "New bot"

- extendedWaitUntil:
    visible: "Message…"
    timeout: 30000
- tapOn: "Message…"
- inputText: ${LUMIO_E2E_MESSAGE}
- pressKey: Enter
- assertVisible: ${LUMIO_E2E_MESSAGE}

- tapOn: "Bot actions"
- tapOn: "Open computer"
- extendedWaitUntil:
    visible: "Open computer"
    timeout: 30000
- tapOn: "Open computer"
- extendedWaitUntil:
    visible: "You have control"
    timeout: 90000
- tapOn: "Close computer"
- tapOn: "Release"
- extendedWaitUntil:
    visible: "Take control"
    timeout: 30000
